<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="date-display"></div>
      <div id="speed-selector">
        <button class="speed-option active" data-speed="auto">Auto</button>
        <button class="speed-option" data-speed="realtime">Realtime</button>
        <button class="speed-option" data-speed="day">1 day / s</button>
        <button class="speed-option" data-speed="month">1 month / s</button>
        <button class="speed-option" data-speed="year">1 year / s</button>
      </div>
      <div id="speed-indicator"><span id="current-speed"></span> · <span id="zoom-level"></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

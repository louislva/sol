<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo:head-->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS to prevent FOUC */
      body { margin: 0; padding: 0; background: #000; font-family: 'Space Mono', monospace; }
      button { background: transparent; border: none; color: #888; font-family: inherit; font-size: 12px; padding: 8px 14px; cursor: pointer; }
      #ui { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); }
      #sidebar { position: fixed; top: 0; right: 0; }
      #sidebar.hidden { display: none; }
      #about.hidden { display: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas" aria-label="Map of the solar system and the Milky Way"></canvas>
    <noscript>
      <p class="noscript">Sol is an interactive map of the solar system and the Milky Way. It needs JavaScript to run.</p>
    </noscript>
    <section id="about" class="hidden" aria-labelledby="about-heading">
      <button id="about-close" aria-label="Close">&times;</button>
      <article id="about-content">
        <!--seo:about-->
      </article>
    </section>
    <div id="sidebar" class="hidden">
      <button id="sidebar-close">&times;</button>
      <div id="sidebar-content"></div>
    </div>
    <div id="ui">
      <div id="date-row">
        <button id="date-display" title="Set the date (click to type)"></button>
        <input id="date-input" class="hidden" type="text" spellcheck="false" autocomplete="off"
               aria-label="Date, e.g. 1977-08-20 or 1969-07-20 20:17 (UTC)" placeholder="YYYY-MM-DD hh:mm">
      </div>
      <div id="transport">
        <button id="rewind" class="transport-button" title="Rewind (←); again for faster" aria-label="Rewind">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9L1.5 8zM14.5 3.5v9L8 8z"/></svg>
        </button>
        <button id="play-pause" class="transport-button" title="Play / pause (Space)" aria-label="Pause">
          <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
          <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11L13 8z"/></svg>
        </button>
        <button id="fast-forward" class="transport-button" title="Fast forward (→); again for faster" aria-label="Fast forward">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9L14.5 8zM1.5 3.5v9L8 8z"/></svg>
        </button>
        <input id="speed-slider" type="range" min="0" max="1000" step="1" aria-label="Speed">
        <span id="speed-readout"></span>
        <button id="auto-speed" class="transport-toggle" title="Pick speed automatically from the view">Auto</button>
        <button id="now-button" class="transport-toggle" title="Jump to the present">Now</button>
      </div>
      <div id="missions-panel" class="hidden" role="dialog" aria-label="Missions">
        <div class="missions-title">Watch a mission from launch</div>
        <div id="missions-list"></div>
      </div>
      <div id="toolbar">
        <button id="missions-button" class="toolbar-button" aria-expanded="false">Missions</button>
        <button id="about-button" class="toolbar-button" aria-expanded="false" aria-controls="about">About</button>
      </div>
      <div id="status-line"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
